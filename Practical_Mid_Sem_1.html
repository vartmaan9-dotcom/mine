<!DOCTYPE html>
<html>
<head>
    <title>Shopping Bill</title>
</head>
<body>
    <h2>Shopping Bill</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price (₹)</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>2</td>
                <td>50</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Pen</td>
                <td>5</td>
                <td>10</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Book</td>
                <td>1</td>
                <td>200</td>
                <td>200</td>
            </tr>
            <tr>
                <td>Bag</td>
                <td>1</td>
                <td>500</td>
                <td>500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total</th>
                <th>850</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
