<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formatting and Special Characters</title>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <p>
        Text with <b>bold</b>, <i>italic</i>,
        <u>underline</u>, <mark>mark</mark>,
        H<sub>2</sub>O, x<sup>2</sup>
    </p>

    <p>&copy; &reg; &trade; &lt;tag&gt; &amp; &pound; &euro; &#8377; &hearts;</p>

    <hr>

    <p>Line one<br>Line two</p>
</body>
</html>
